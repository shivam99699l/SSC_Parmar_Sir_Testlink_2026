<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SSC CGL 2026 Polity — Part 1 Test</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --border:#d9dee8; --accent:#2563eb; --good:#16803c; --bad:#c62828; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 14px}
.title{font-size:20px;font-weight:700;margin-bottom:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:7px 10px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:700}
.stat.correct{background:#e8f7ee;color:var(--good)}
.stat.wrong{background:#fdecec;color:var(--bad)}
.stat.unvisited{background:#fff4db;color:#8a5a00}
.progress{height:8px;background:#e9edf3;border-radius:10px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0}
.container{max-width:900px;margin:18px auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.qnum{font-weight:800;color:var(--accent);margin-bottom:8px}
.question{font-size:17px;line-height:1.5;font-weight:600;margin-bottom:14px}
.option{display:block;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.selected{border-color:var(--accent);background:#eef4ff}
.option.correct{border-color:var(--good);background:#e8f7ee;color:#11652f}
.option.wrong{border-color:var(--bad);background:#fdecec;color:#a61b1b}
.option:disabled{cursor:default}
.option.result-correct::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.option.result-wrong::after{content:'✕';float:right;font-size:20px;font-weight:800;color:var(--bad);margin-left:10px}
.option.correct-answer::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#f3f5f8;line-height:1.5}
.feedback.good{background:#e8f7ee}
.feedback.bad{background:#fdecec}
.explanation{margin-top:8px}


.finish-test-btn{border:0;background:#172033;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}
.finish-test-btn:hover{background:#0f172a}
.finish-summary{margin-top:12px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--border);line-height:1.6}

.collections{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.collection-btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.collection-btn:hover{border-color:var(--accent)}
.collection-panel{display:none;margin-top:10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px}
.collection-panel.show{display:block}
.collection-title{font-size:13px;font-weight:800;margin-bottom:7px}
.collection-list{display:flex;flex-wrap:wrap;gap:6px}
.collection-item{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer}
.collection-item:hover{border-color:var(--accent);color:var(--accent)}

.final{display:none;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:20px;margin:20px 0;font-size:17px}
.reset{border:0;background:var(--accent);color:#fff;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}
@media(max-width:600px){.title{font-size:18px}.question{font-size:16px}.container{padding:0 8px 30px}.card{padding:14px}}
</style>
</head>

SSC Polity questions."},{"num":268,"page":325,"question":"Read the below statements related to concurrent List laws 1. Union law overrides state law in conflict, 2. State law can prevail if reserved and assented by President Which is are correct?","options":{"A":"Only 2","B":"Only 1","C":"Both 1 and 2","D":"Neither 1 nor 2"},"correct":"C","answer_line":"Answer: (C) Both 1 and 2","explanation":"The **Seventh Schedule** distributes legislative subjects among the **Union List, State List and Concurrent List**. **SSC Key Point:** Union + State + Concurrent = Schedule VII."},{"num":269,"page":326,"question":"Statement I: Land and agriculture fall under the State List Statement II: Marriage laws and adoption fall under the Concurrent List Which of the statements given above is are correct?","options":{"A":"Only Statement I is correct","B":"Only Statement II is correct","C":"Both statements I and II are correct","D":"Neither statement I nor II is correct"},"correct":"C","answer_line":"Answer: (C) Both statements I and II are correct","explanation":"The **Seventh Schedule** distributes legislative subjects among the **Union List, State List and Concurrent List**. **SSC Key Point:** Union + State + Concurrent = Schedule VII."},{"num":270,"page":327,"question":"Which of the following statements based on the Union List entries is are correct? 1.The Parliament has exclusive power to legislate on lotteries conducted by both the Central and State governments. 2.Matters related to the incorporation and regulation of cooperative societies are included in the Union List. 3. The Reserve Bank of India, foreign exchange, and currency are all under the legislative domain of the Union. 4.Parliament can make laws regarding corporations whose activities are not limited to one State, excluding universities.","options":{"A":"Only 1, 3, and 4","B":"Only 2 and 3","C":"Only 1 and 4","D":"All four statements 1,2,3 and 4 are correct"},"correct":"A","answer_line":"Answer: (A) Only 1, 3, and 4","ex e Government can, with Union's consent, assign Union functions to its officers. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":274,"page":333,"question":"Which article of the Indian Constitution is related with the Duty of the Union to protect States against external aggression and internal disturbance?","options":{"A":"Article 348","B":"Article 352","C":"Article 355","D":"Article 361"},"correct":"C","answer_line":"Answer: (C) Article 355","explanation":"**Answer:** Article 355. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":275,"page":334,"question":"Under which Article is the Inter-State Council established to promote coordination between the Union and States and resolve inter-governmental disputes?","options":{"A":"262","B":"263","C":"280","D":"312"},"correct":"B","answer_line":"Answer: (B) 263","explanation":"**Answer:** 263. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":276,"page":335,"question":"Which of the following articles deals with the Inter-State Council?","options":{"A":"Article 256","B":"Article 263","C":"Article 262","D":"Article 261"},"correct":"B","answer_line":"Answer: (B) Article 263","explanation":"**Answer:** Article 263. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":277,"page":336,"question":"Which of the following commissions recommended the creation of the Inter-State Council?","options":{"A":"Mandal Commission","B":"Balwan y 1. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":284,"page":343,"question":"Which of the following statements regarding the North Eastern Council (NEC) is not correct? (NEC)?","options":{"A":"The NEC was constituted under the North Eastern Council Act of 1971. ( - 1971 NEC )","B":"The NEC ceased to function as a regional planning body after it was declared a statutory body in 2002. ( - (NEC) )","C":"The Governors and Chief Ministers of all eight North Eastern states are members of the NE","D":"The Union Home Minister was designated as the ex-officio Chairman of the NEC after the 2002 amendment"},"correct":"B","answer_line":"Answer: (B) The NEC ceased to function as a regional planning body after it was declared a statutory body in 2002. ( - (NEC) )","explanation":"**Answer:** The NEC ceased to function as a regional planning body after it was declared a statutory body in 2002. ( - (NEC) ). **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":285,"page":344,"question":"The Union Home Minister chairs a Zonal Council meeting as _____ chairman. ______","options":{"A":"ex-officio","B":"rotating","C":"ceremonial","D":"honorary"},"correct":"A","answer_line":"Answer: (A) ex-officio","explanation":"**Answer:** ex-officio. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":286,"page":345,"question":"Inter-State Council is a constitutional body under Article 263. - 263 2. Its recommendations are binding on the Union and States. Which of the above statements is are correct?","options":{"A":"Only 1","B":"Only 2","C":"Both 1 and 2","D":"Neither 1 nor 2"},"correct":"A","answer_line":"Answer: (A) Only 1","explanation":"**Answer:** Only 1. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":287,"page":346,"question":"Under Article 262 of the Indian Constitution, which of the following interpretations most accurately reflects Parliament's authority regarding inter-State water disputes? 262, - -","options":{"A":"Legislate on river navigation but not bar SC jurisdiction","B":"Set up tribunals for water disputes and bar SC review","C":"Abolish State-level water bodies permanently","D":"Mandate ISC mediation before court action"},"correct":"B","answer_line":"Answer: (B) Set up tribunals for water disputes and bar SC review","explanation":"**Answer:** Set up tribunals for water disputes and bar SC review. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":288,"page":348,"question":"Grants-in-aid to States in need of assistance are given under:","options":{"A":"Article 270","B":"Article 275","C":"Article 280","D":"Article 282"},"correct":"B","answer_line":"Answer: (B) Article 275","explanation":"**Answer:** Article 275. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":289,"page":349,"question":"Fill in the blanks: Grants-in-Aid to States are provided under Article ____. : ____","options":{"A":"275","B":"280","C":"265","D":"110"},"correct":"A","answer_line":"Answer: (A) 275","explanation":"**Answer:** 275. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":290,"page":350,"question":"To which level of government do taxes on railway fares and freights accrue?","options":{"A":"Union","B":"State","C":"Municipal Corporation","D":"Panchayat"},"correct":"A","answer_line":"Answer: (A) Union","explanation":"**Answer:** Union. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":291,"page":351,"question":"What does Article 268 of the Indian Constitution primarily deal with? 268?","options":{"A":"Service tax levied by Union and collected by States","B":"Income tax levied and collected by States","C":"Stamp duties levied by Union but collected by States","D":"Excise duties on medicinal products collected by States"},"correct":"C","answer_line":"Answer: (C) Stamp duties levied by Union but collected by States","explanation":"**Answer:** Stamp duties levied by Union but collected by States. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":292,"page":352,"question":"Taxes on interstate trade are restricted by Article ____ unless Parliament otherwise provides. ____,","options":{"A":"286","B":"269","C":"276","D":"294"},"correct":"A","answer_line":"Answer: (A) 286","explanation":"**Answer:** 286. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":293,"page":353,"question":"Which of the following statements is are correct regarding the borrowing powers of States in India? ? 1) A State requires the Centre's consent for internal borrowing if it owes any debt to the Centre 2) No State can raise loans from foreign sources withou const state = Array(questions.length).fill(null);

function render() {
  const root=document.getElementById('questions');
  root.innerHTML='';
  questions.forEach((q,i)=>{
    const card=document.createElement('div'); card.className='card'; card.id='q'+i;
    const qn=document.createElement('div'); qn.className='qnum'; qn.textContent='Question '+(i+1);
    const qt=document.createElement('div'); qt.className='question'; qt.textContent=q.question;
    card.append(qn,qt);
    Object.entries(q.options).forEach(([letter,text])=>{
      const b=document.createElement('button'); b.className='option';
      b.textContent='('+letter+') '+text;
      b.onclick=()=>answer(i,letter,b);
      card.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='feedback'; fb.style.display='none'; fb.id='fb'+i;
    card.appendChild(fb);
    root.appendChild(card);
  });
}
function answer(i,letter,clicked){
  if(state[i]!==null) return;
  state[i]=letter;
  const q=questions[i];
  const card=document.getElementById('q'+i);
  card.querySelectorAll('.option').forEach(b=>{
    b.disabled=true;
    const l=(b.textContent.match(/^\(([A-D])\)/)||[])[1];
    if(l===q.correct) {
      b.classList.add('correct');
      if(letter===q.correct) b.classList.add('result-correct');
      else b.classList.add('correct-answer');
    }
    if(l===letter && letter!==q.correct) {
      b.classList.add('wrong','result-wrong');
    }
    if(l===letter) b.classList.add('selected');
  });
  const fb=document.getElementById('fb'+i);
  const ok=letter===q.correct;
  fb.className='feedback '+(ok?'good':'bad');
  fb.style.display='block';
  fb.innerHTML='<strong>'+ (ok?'Correct':'Incorrect') +'</strong><br>'+
    escapeHtml(q.answer_line)+
    (q.explanation ? '<div class="explanation"><strong>Explanation:</strong><br>'+escapeHtml(q.explanation).replace(/\n/g,'<br>')+'</div>' : '');
  updateStats();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

let activeCollection = null;

function toggleCollection(type){
  const panel=document.getElementById('collectionPanel');
  if(activeCollection===type){
    panel.classList.remove('show');
    activeCollection=null;
    return;
  }
  activeCollection=type;
  panel.classList.add('show');
  renderCollection(type);
}

function renderCollection(type){
  const title=document.getElementById('collectionTitle');
  const list=document.getElementById('collectionList');
  let indexes=[];
  if(type==='correct') indexes=state.map((x,i)=>x!==null && x===questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='wrong') indexes=state.map((x,i)=>x!==null && x!==questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='unvisited') indexes=state.map((x,i)=>x===null ? i : -1).filter(i=>i>=0);

  const names={correct:'✓ Correct Questions',wrong:'✕ Incorrect Questions',unvisited:'○ Unvisited Questions'};
  title.textContent=names[type]+' ('+indexes.length+')';
  list.innerHTML='';
  if(!indexes.length){
    list.innerHTML='<span style="font-size:12px;color:#667085">No questions in this collection.</span>';
    return;
  }
  indexes.forEach(i=>{
    const b=document.createElement('button');
    b.className='collection-item';
    b.textContent='Q'+(i+1);
    b.onclick=()=>{
      const target=document.getElementById('q'+i);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    };
    list.appendChild(b);
  });
}

function updateStats(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('unvisited').textContent=unvisited;
  document.getElementById('attempted').textContent=attempted;
  document.getElementById('progress').style.width=(attempted/questions.length*100)+'%';
  document.getElementById('correctCount2').textContent=correct;
  document.getElementById('wrongCount2').textContent=wrong;
  document.getElementById('unvisitedCount2').textContent=unvisited;
  if(activeCollection) renderCollection(activeCollection);
  if(attempted===questions.length){
    const pct=(correct/questions.length*100).toFixed(2);
    const f=document.getElementById('final'); f.style.display='block';
    f.innerHTML='<strong>Final Score</strong><br>'+correct+' / '+questions.length+
      ' correct ('+pct+'%)<br><br><button class="reset" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Review Test</button>';
  }
}

function finishTest(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  const pct=(correct/questions.length*100).toFixed(2);

  const f=document.getElementById('final');
  f.style.display='block';
  f.innerHTML='<strong>Test Finished</strong>'+
    '<div class="finish-summary">'+
    '<strong>Correct:</strong> '+correct+'<br>'+
    '<strong>Incorrect:</strong> '+wrong+'<br>'+
    '<strong>Unvisited:</strong> '+unvisited+'<br>'+
    '<strong>Attempted:</strong> '+attempted+' / '+questions.length+'<br>'+
    '<strong>Score:</strong> '+correct+' / '+questions.length+' ('+pct+'%)'+
    '</div>';
  f.scrollIntoView({behavior:'smooth',block:'start'});
}

render();
</script>
