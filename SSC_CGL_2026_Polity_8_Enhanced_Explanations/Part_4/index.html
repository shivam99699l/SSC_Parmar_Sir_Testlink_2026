<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SSC CGL 2026 Polity — Part 1 Test</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --border:#d9dee8; --accent:#2563eb; --good:#16803c; --bad:#c62828; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 14px}
.title{font-size:20px;font-weight:700;margin-bottom:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:7px 10px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:700}
.stat.correct{background:#e8f7ee;color:var(--good)}
.stat.wrong{background:#fdecec;color:var(--bad)}
.stat.unvisited{background:#fff4db;color:#8a5a00}
.progress{height:8px;background:#e9edf3;border-radius:10px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0}
.container{max-width:900px;margin:18px auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.qnum{font-weight:800;color:var(--accent);margin-bottom:8px}
.question{font-size:17px;line-height:1.5;font-weight:600;margin-bottom:14px}
.option{display:block;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.selected{border-color:var(--accent);background:#eef4ff}
.option.correct{border-color:var(--good);background:#e8f7ee;color:#11652f}
.option.wrong{border-color:var(--bad);background:#fdecec;color:#a61b1b}
.option:disabled{cursor:default}
.option.result-correct::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.option.result-wrong::after{content:'✕';float:right;font-size:20px;font-weight:800;color:var(--bad);margin-left:10px}
.option.correct-answer::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#f3f5f8;line-height:1.5}
.feedback.good{background:#e8f7ee}
.feedback.bad{background:#fdecec}
.explanation{margin-top:8px}


.finish-test-btn{border:0;background:#172033;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}
.finish-test-btn:hover{background:#0f172a}
.finish-summary{margin-top:12px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--border);line-height:1.6}

.collections{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.collection-btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.collection-btn:hover{border-color:var(--accent)}
.collection-panel{display:none;margin-top:10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px}
.collection-panel.show{display:block}
.collection-title{font-size:13px;font-weight:800;margin-bottom:7px}
.collection-list{display:flex;flex-wrap:wrap;gap:6px}
.collection-item{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer}
.collection-item:hover{border-color:var(--accent);color:var(--accent)}

.final{display:none;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:20px;margin:20px 0;font-size:17px}
.reset{border:0;background:var(--accent);color:#fff;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}
@media(max-width:600px){.title{font-size:18px}.question{font-size:16px}.container{padding:0 8px 30px}.card{padding:14px}}
</style>
</head>

<script>
const questions = [{"num":160,"page":197,"question":"Which of the following statement is correct regarding the election of Vice president of India? I. He should have completed 35 years of age II. He should be qualified for election as a member of the Council of States","options":{"A":"Only I","B":"Only II","C":"Both I and II","D":"Neither I nor II"},"correct":"C","answer_line":"Answer: (C) Both I and II","explanation":"**Answer:** Both I and II. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":161,"page":198,"question":"The Vice President of India can be removed from office by__________. __________.","options":{"A":"Impeachment by the President","B":"Resolution passed by the Council of States and agreed to by the House of the People","C":"Resolution passed by both Houses of Parliament with one-thirds majority ( - )","D":"The President on the advice of the Prime Minister"},"correct":"B","answer_line":"Answer: (B) Resolution passed by the Council of States and agreed to by the House of the People","explanation":"**Answer:** Resolution passed by the Council of States and agreed to by the House of the People. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":162,"page":199,"question":"The Vice-President of India is part of which branch of the government?","options":{"A":"Legislative only","B":"Executive only","C":"Judicial only","D":"Both Executive and Legislative"},"correct":"D","answer_line":"Answer: (D) Both Executive and Legislative","explanation":"**Answer:** Both Executive and Legislative. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":163,"page":202,"question":"In the Union Government of India, who is considered the real executive authority and head of the Council of Ministers?","options":{"A":"President","B":"President","C":"Prime Minister","D":"Cabinet Secretary"},"correct":"C","answer_line":"Answer: (C) Prime Minister","explanation":"**Answer:** Prime Minister. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":164,"page":203,"question":"Which of the following statements best explains the dual role of the Prime Minister of India as both the leader of the Council of Ministers and the chief coordinator between the executive and the President, highlighting the extent and limits of his her constitutional powers?","options":{"A":"The Prime Minister can independently appoint and dismiss ministers without consulting the President or the Cabinet","B":"The Prime Minister acts as the principal advisor to the President, heading the Council of Ministers, and exercises real executive authority, but all decisions require formal approval from the President who can refuse the Prime Minister's advice.","C":"The Prime Minister leads the Council of Ministers, advises the President on appointment and dismissal of ministers, and directs policy, but formally exercises power only through the President, who generally acts on the Prime Minister's advice except in exceptional circumstances.","D":"The Prime Minister has absolute authority to make all executive decisions and can override the President's constitutional powers at will."},"correct":"C","answer_line":"Answer: (C) The Prime Minister leads the Council of Ministers, advises the President on appointment and dismissal of ministers, and directs policy, but formally exercises power only through the President, who generally acts on the Prime Minister's advice except in exceptional circumstances.","explanation":"**Answer:** The Prime Minister leads the Council of Ministers, advises the President on appointment and dismissal of ministers, and directs policy, but formally exercises power only through the President, who generally acts on the Prime Minister's advice except in exceptional circumstances.. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":165,"page":205,"question":"What is the minimum age to become the Prime Minister of India?","options":{"A":"25 years","B":"30 years","C":"35 years","D":"18 years"},"correct":"A","answer_line":"Answer: (A) 25 years","explanation":"**Answer:** 25 years. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":166,"page":206,"question":"What subject does Article 77 of the Indian Constitution pertain to? 77?","options":{"A":"Rights of ministers in Parliament","B":"Duties of prime minister","C":"Conduct of business of the Government of India","D":"Council of Ministers to aid and advise President ( - )"},"correct":"C","answer_line":"Answer: (C) Conduct of business of the Government of India","explanation":"**Answer:** Conduct of business of the Government of India. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":167,"page":207,"question":"Who served as the Prime Minister of India from 1991 to 1996? 1991 1996?","options":{"A":"Charan Singh","B":"Rajiv Gandhi","C":"Gulzarilal Nanda","D":"P.V. Narasimha Rao"},"correct":"D","answer_line":"Answer: (D) P.V. Narasimha Rao","explanation":"**Answer:** P.V. Narasimha Rao. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":168,"page":208,"question":"The Vice-President of India is part of which branch of the government?","options":{"A":"Legislative only","B":"Executive only","C":"Judicial only","D":"Both Executive and Legislative"},"correct":"D","answer_line":"Answer: (D) Both Executive and Legislative","explanation":"**Answer:** Both Executive and Legislative. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":169,"page":210,"question":"The Constitution prescribes that Union Ministers are collectively responsible to:","options":{"A":"President","B":"Parliament","C":"Lok Sabha","D":"Prime Minister"},"correct":"C","answer_line":"Answer: (C) Lok Sabha","explanation":"**Answer:** Lok Sabha. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":170,"page":211,"question":"Which of the following constitutional amendments made the Council of Ministers collectively responsible to the Lok Sabha?","options":{"A":"42nd Amendment","B":"44th Amendment","C":"52nd Amendment","D":"Not by amendment; it's already in the constitution"},"correct":"D","answer_line":"Answer: (D) Not by amendment; it's already in the constitution","explanation":"**Answer:** Not by amendment; it's already in the constitution. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":171,"page":212,"question":"What is the maximum number of ministers, including the Prime Minister, allowed in the Council of Ministers as per the 91st Constitutional Amendment Act, 2003 of constitution of India? 91, 2003,","options":{"A":"10% of the total strength of Parliament","B":"12% of the total strength of the House of the People","C":"15% of the total strength of the House of the People","D":"No constitutional limit is prescribed"},"correct":"C","answer_line":"Answer: (C) 15% of the total strength of the House of the People","explanation":"**Answer:** 15% of the total strength of the House of the People. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":172,"page":213,"question":"The 91st Amendment Act, 2003 of the Indian Constitution is related with which of the following? 91, 2003?","options":{"A":"Limiting the size of the Council of Ministers","B":"No enhancement of seats of Lok sabha and vidhan sabha til 2026 (2026 )","C":"Bifurcation of the National commission of SC and ST","D":"Fixed the strength of the Goa Legislative Assembly at a minimum of 30 members ( 30 )"},"correct":"A","answer_line":"Answer: (A) Limiting the size of the Council of Ministers","explanation":"**Answer:** Limiting the size of the Council of Ministers. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":173,"page":214,"question":"A Minister who is not a member of Parliament at the time of appointment must get elected to either House within what time frame to continue holding office constitutionally?","options":{"A":"3 months","B":"6 months","C":"1 year","D":"Next election"},"correct":"B","answer_line":"Answer: (B) 6 months","explanation":"**Answer:** 6 months. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":174,"page":215,"question":"For how long a person can serve as a minister without being a member of either House of Parliament of India?","options":{"A":"6 consecutive months","B":"3 consecutive months","C":"12 consecutive months","D":"2 consecutive month"},"correct":"A","answer_line":"Answer: (A) 6 consecutive months","explanation":"**Answer:** 6 consecutive months. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":175,"page":216,"question":"Which of the following statements regarding the constitutional responsibility of the Council of Ministers (CoM) is are correct? (CoM) 1) The Union Council of Ministers is collectively accountable to the Lok Sabha 2) In states with bicameral legislatures, the State CoM is collectively responsible to the Legislative Council,","options":{"A":"Only 1","B":"Only 2","C":"Both 1 and 2","D":"Neither 1 nor 2"},"correct":"A","answer_line":"Answer: (A) Only 1","explanation":"**Answer:** Only 1. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":176,"page":218,"question":"Which house of Parliament is called the Upper House?","options":{"A":"Lok Sabha","B":"Rajya Sabha","C":"Vidhan Sabha","D":"Gram Sabha"},"correct":"B","answer_line":"Answer: (B) Rajya Sabha","explanation":"**Answer:** Rajya Sabha. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":177,"page":219,"question":"What is the minimum age required to become a Member of Lok Sabha?","options":{"A":"18 years","B":"21 years","C":"25 years","D":"30 years"},"correct":"C","answer_line":"Answer: (C) 25 years","explanation":"**Answer:** 25 years. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":178,"page":220,"question":"Which Article of the Indian Constitution governs the allocation of seats in the Rajya Sabha (Council of States)?","options":{"A":"Article 81","B":"Article 80","C":"Article 88","D":"Article 102"},"correct":"B","answer_line":"Answer: (B) Article 80","explanation":"**Answer:** Article 80. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":179,"page":221,"question":"What is the minimum age to become a member of Rajya Sabha?","options":{"A":"25","B":"30","C":"35","D":"21"},"correct":"B","answer_line":"Answer: (B) 30","explanation":"**Answer:** 30. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":180,"page":222,"question":"The members of Rajya Sabha are elected for a term of _________. _______","options":{"A":"4 years","B":"5 years","C":"6 years","D":"Till dissolution"},"correct":"C","answer_line":"Answer: (C) 6 years","explanation":"**Answer:** 6 years. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":181,"page":223,"question":"Consider the following statements about the Rajya Sabha and choose the correct option 1) Rajya Sabha is a continuing house of the Parliament, immune to dissolution under any circumstance, 2) Rajya Sabha members serve staggered six-year terms, with one-third retiring every two years., -","options":{"A":"Only 1","B":"Only 2","C":"Both 1 and 2","D":"Neither 1 nor 2"},"correct":"C","answer_line":"Answer: (C) Both 1 and 2","explanation":"**Answer:** Both 1 and 2. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":182,"page":224,"question":"12 members having knowledge in the literature, science, art & social service are elected directly by the president to which of the following house?,, 12","options":{"A":"Loksabha","B":"Rajyasabha","C":"Vidhan sabha","D":"Vidhan Parishad"},"correct":"B","answer_line":"Answer: (B) Rajyasabha","explanation":"**Answer:** Rajyasabha. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":183,"page":225,"question":"How many members can the President of India nominate to the Rajya Sabha?","options":{"A":"10","B":"12","C":"14","D":"15"},"correct":"B","answer_line":"Answer: (B) 12","explanation":"**Answer:** 12. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":184,"page":226,"question":"The term \"Office of Profit,\" used to determine disqualification of Members of Parliament for holding certain positions that may influence independence, is mentioned under which constitutional Article?","options":{"A":"Article 102","B":"Article 105","C":"Article 110","D":"Article 312"},"correct":"A","answer_line":"Answer: (A) Article 102","explanation":"**Answer:** Article 102. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":185,"page":227,"question":"The maximum strength of the Lok Sabha (House of the People) as stipulated by the Constitution is:","options":{"A":"530 members","B":"552 members","C":"550 members","D":"545 members"},"correct":"C","answer_line":"Answer: (C) 550 members","explanation":"**Answer:** 550 members. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":186,"page":229,"question":"Who presides over the Lok Sabha sessions?","options":{"A":"Chief Justice of India","B":"Prime Minister of India","C":"Speaker of the Lok Sabha","D":"President of India"},"correct":"C","answer_line":"Answer: (C) Speaker of the Lok Sabha","explanation":"**Answer:** Speaker of the Lok Sabha. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":187,"page":230,"question":"Who presided over the 18th Lok Sabha as the Speaker in 2025? 2025 18?","options":{"A":"Om Birla","B":"Meenakshi Lekhi","C":"Kiren Rijiju","D":"Rajnath Singh"},"correct":"A","answer_line":"Answer: (A) Om Birla","explanation":"**Answer:** Om Birla. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":188,"page":232,"question":"Which article of the Indian Constitution deals with sessions of Parliament?","options":{"A":"Article 74","B":"Article 85","C":"Article 93","D":"Article 100"},"correct":"B","answer_line":"Answer: (B) Article 85","explanation":"**Answer:** Article 85. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":189,"page":233,"question":"President shall from time to time summon each House of Parliament to meet at such time and place as he thinks fit, but ______ months shall not intervene between its last sitting in one session and the date appointed for its first sitting in the next session., ______","options":{"A":"twelve","B":"three","C":"six","D":"nine"},"correct":"C","answer_line":"Answer: (C) six","explanation":"**Answer:** six. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":190,"page":234,"question":"When deadlock arises the President has to summon joint sitting of two houses of parliament comes under which article?","options":{"A":"Art-92","B":"Art-64","C":"Art-201","D":"Art-108"},"correct":"D","answer_line":"Answer: (D) Art-108","explanation":"**Answer:** Art-108. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":191,"page":235,"question":"Who presides over the joint sitting of Parliament?","options":{"A":"Chairman of Rajya Sabha","B":"President","C":"Speaker of Lok Sabha","D":"Prime Minister"},"correct":"C","answer_line":"Answer: (C) Speaker of Lok Sabha","explanation":"**Answer:** Speaker of Lok Sabha. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":192,"page":236,"question":"What is the role of the Speaker in the case of a tie during voting in the Lok Sabha?","options":{"A":"Decides based on personal preference","B":"casting vote","C":"Does not participate","D":"Refers the decision to the President"},"correct":"B","answer_line":"Answer: (B) casting vote","explanation":"**Answer:** casting vote. **SSC Key Point:** Remember this fact together with the constitutional article/body/te const state = Array(questions.length).fill(null);

function render() {
  const root=document.getElementById('questions');
  root.innerHTML='';
  questions.forEach((q,i)=>{
    const card=document.createElement('div'); card.className='card'; card.id='q'+i;
    const qn=document.createElement('div'); qn.className='qnum'; qn.textContent='Question '+(i+1);
    const qt=document.createElement('div'); qt.className='question'; qt.textContent=q.question;
    card.append(qn,qt);
    Object.entries(q.options).forEach(([letter,text])=>{
      const b=document.createElement('button'); b.className='option';
      b.textContent='('+letter+') '+text;
      b.onclick=()=>answer(i,letter,b);
      card.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='feedback'; fb.style.display='none'; fb.id='fb'+i;
    card.appendChild(fb);
    root.appendChild(card);
  });
}
function answer(i,letter,clicked){
  if(state[i]!==null) return;
  state[i]=letter;
  const q=questions[i];
  const card=document.getElementById('q'+i);
  card.querySelectorAll('.option').forEach(b=>{
    b.disabled=true;
    const l=(b.textContent.match(/^\(([A-D])\)/)||[])[1];
    if(l===q.correct) {
      b.classList.add('correct');
      if(letter===q.correct) b.classList.add('result-correct');
      else b.classList.add('correct-answer');
    }
    if(l===letter && letter!==q.correct) {
      b.classList.add('wrong','result-wrong');
    }
    if(l===letter) b.classList.add('selected');
  });
  const fb=document.getElementById('fb'+i);
  const ok=letter===q.correct;
  fb.className='feedback '+(ok?'good':'bad');
  fb.style.display='block';
  fb.innerHTML='<strong>'+ (ok?'Correct':'Incorrect') +'</strong><br>'+
    escapeHtml(q.answer_line)+
    (q.explanation ? '<div class="explanation"><strong>Explanation:</strong><br>'+escapeHtml(q.explanation).replace(/\n/g,'<br>')+'</div>' : '');
  updateStats();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

let activeCollection = null;

function toggleCollection(type){
  const panel=document.getElementById('collectionPanel');
  if(activeCollection===type){
    panel.classList.remove('show');
    activeCollection=null;
    return;
  }
  activeCollection=type;
  panel.classList.add('show');
  renderCollection(type);
}

function renderCollection(type){
  const title=document.getElementById('collectionTitle');
  const list=document.getElementById('collectionList');
  let indexes=[];
  if(type==='correct') indexes=state.map((x,i)=>x!==null && x===questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='wrong') indexes=state.map((x,i)=>x!==null && x!==questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='unvisited') indexes=state.map((x,i)=>x===null ? i : -1).filter(i=>i>=0);

  const names={correct:'✓ Correct Questions',wrong:'✕ Incorrect Questions',unvisited:'○ Unvisited Questions'};
  title.textContent=names[type]+' ('+indexes.length+')';
  list.innerHTML='';
  if(!indexes.length){
    list.innerHTML='<span style="font-size:12px;color:#667085">No questions in this collection.</span>';
    return;
  }
  indexes.forEach(i=>{
    const b=document.createElement('button');
    b.className='collection-item';
    b.textContent='Q'+(i+1);
    b.onclick=()=>{
      const target=document.getElementById('q'+i);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    };
    list.appendChild(b);
  });
}

function updateStats(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('unvisited').textContent=unvisited;
  document.getElementById('attempted').textContent=attempted;
  document.getElementById('progress').style.width=(attempted/questions.length*100)+'%';
  document.getElementById('correctCount2').textContent=correct;
  document.getElementById('wrongCount2').textContent=wrong;
  document.getElementById('unvisitedCount2').textContent=unvisited;
  if(activeCollection) renderCollection(activeCollection);
  if(attempted===questions.length){
    const pct=(correct/questions.length*100).toFixed(2);
    const f=document.getElementById('final'); f.style.display='block';
    f.innerHTML='<strong>Final Score</strong><br>'+correct+' / '+questions.length+
      ' correct ('+pct+'%)<br><br><button class="reset" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Review Test</button>';
  }
}

function finishTest(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  const pct=(correct/questions.length*100).toFixed(2);

  const f=document.getElementById('final');
  f.style.display='block';
  f.innerHTML='<strong>Test Finished</strong>'+
    '<div class="finish-summary">'+
    '<strong>Correct:</strong> '+correct+'<br>'+
    '<strong>Incorrect:</strong> '+wrong+'<br>'+
    '<strong>Unvisited:</strong> '+unvisited+'<br>'+
    '<strong>Attempted:</strong> '+attempted+' / '+questions.length+'<br>'+
    '<strong>Score:</strong> '+correct+' / '+questions.length+' ('+pct+'%)'+
    '</div>';
  f.scrollIntoView({behavior:'smooth',block:'start'});
}

render();
</script>
