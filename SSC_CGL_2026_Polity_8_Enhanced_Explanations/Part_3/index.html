<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SSC CGL 2026 Polity — Part 1 Test</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --border:#d9dee8; --accent:#2563eb; --good:#16803c; --bad:#c62828; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 14px}
.title{font-size:20px;font-weight:700;margin-bottom:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:7px 10px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:700}
.stat.correct{background:#e8f7ee;color:var(--good)}
.stat.wrong{background:#fdecec;color:var(--bad)}
.stat.unvisited{background:#fff4db;color:#8a5a00}
.progress{height:8px;background:#e9edf3;border-radius:10px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0}
.container{max-width:900px;margin:18px auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.qnum{font-weight:800;color:var(--accent);margin-bottom:8px}
.question{font-size:17px;line-height:1.5;font-weight:600;margin-bottom:14px}
.option{display:block;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.selected{border-color:var(--accent);background:#eef4ff}
.option.correct{border-color:var(--good);background:#e8f7ee;color:#11652f}
.option.wrong{border-color:var(--bad);background:#fdecec;color:#a61b1b}
.option:disabled{cursor:default}
.option.result-correct::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.option.result-wrong::after{content:'✕';float:right;font-size:20px;font-weight:800;color:var(--bad);margin-left:10px}
.option.correct-answer::after{content:'✓';float:right;font-size:20px;font-weight:800;color:var(--good);margin-left:10px}
.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#f3f5f8;line-height:1.5}
.feedback.good{background:#e8f7ee}
.feedback.bad{background:#fdecec}
.explanation{margin-top:8px}


.finish-test-btn{border:0;background:#172033;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}
.finish-test-btn:hover{background:#0f172a}
.finish-summary{margin-top:12px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--border);line-height:1.6}

.collections{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.collection-btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.collection-btn:hover{border-color:var(--accent)}
.collection-panel{display:none;margin-top:10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px}
.collection-panel.show{display:block}
.collection-title{font-size:13px;font-weight:800;margin-bottom:7px}
.collection-list{display:flex;flex-wrap:wrap;gap:6px}
.collection-item{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer}
.collection-item:hover{border-color:var(--accent);color:var(--accent)}

.final{display:none;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:20px;margin:20px 0;font-size:17px}
.reset{border:0;background:var(--accent);color:#fff;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}
@media(max-width:600px){.title{font-size:18px}.question{font-size:16px}.container{padding:0 8px 30px}.card{padding:14px}}
</style>
</head>

<script>
const questions = [{"num":107,"page":135,"question":"Which of the following most accurately describes the legal character of the right to property under Article 300A of the Indian Constitution? - 300A","options":{"A":"It is a fundamental right that guarantees compensation for all property acquisitions.","B":"It allows the State to deprive a person of property by any law, even without due process. (,, )","C":"It is a constitutional legal right that permits deprivation only by authority of law.","D":"It permits citizens to claim property protection under Article 32 before the Supreme Court. ( 32 )"},"correct":"C","answer_line":"Answer: (C) It is a constitutional legal right that permits deprivation only by authority of law.","explanation":"**Answer:** It is a constitutional legal right that permits deprivation only by authority of law.. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":108,"page":137,"question":"Which Article of our constitution was declared as heart and soul by Dr. Ambedkar? Dr.?","options":{"A":"Art 21","B":"Art 32","C":"Art 15","D":"Art 125"},"correct":"B","answer_line":"Answer: (B) Art 32","explanation":"**Answer:** Art 32. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":109,"page":138,"question":"Which Article of the Constitution confers the right to constitutional remedies, and how is it linked to Fundamental Rights?","options":{"A":"Article 32; it is called the \"heart and soul\" of the Constitution ( 32; \" \" )","B":"Article 226; it is a protective mechanism for Directive Principles ( 226; )","C":"Article 21; it deals with personal liberty only","D":"Article 14; it ensures equality before law"},"correct":"A","answer_line":"Answer: (A) Article 32; it is called the \"heart and soul\" of the Constitution ( 32; \" \" )","explanation":"**Answer:** Article 32; it is called the \"heart and soul\" of the Constitution ( 32; \" \" ). **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":110,"page":139,"question":"The writ that examines the legality of a person holding a public office is:","options":{"A":"Habeas Corpus","B":"Mandamus","C":"Certiorari","D":"Quo Warranto"},"correct":"D","answer_line":"Answer: (D) Quo Warranto","explanation":"**Answer:** Quo Warranto. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":111,"page":140,"question":"Which of the given writs Literally means command, i.e. to command a person to do its duty?","options":{"A":"Prohibition","B":"Certiorari","C":"Mandamus","D":"Quo warranto"},"correct":"C","answer_line":"Answer: (C) Mandamus","explanation":"**Answer:** Mandamus. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":112,"page":141,"question":"Which of the following writ is issued by a higher court (High Court or Supreme Court) when a lower court has considered a case going beyond its jurisdiction?","options":{"A":"Habeas corpus","B":"Prohibition","C":"certiorari","D":"Quo- warranto"},"correct":"B","answer_line":"Answer: (B) Prohibition","explanation":"**Answer:** Prohibition. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":113,"page":142,"question":"Article 33 of Part III of the constitution: III 33:","options":{"A":"Allows Parliament to suspend all Fundamental Rights for the armed forces","B":"Empowers Parliament to restrict or Fundamental Rights for armed forces","C":"Allows both Parliament and State Legislatures to limit rights of armed forces","D":"Allows the President to restrict through an executive"},"correct":"B","answer_line":"Answer: (B) Empowers Parliament to restrict or Fundamental Rights for armed forces","explanation":"**Answer:** Empowers Parliament to restrict or Fundamental Rights for armed forces. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":114,"page":143,"question":"Consider the following statements: 1. Article 35 is included in Part IV of the Constitution. 2. It empowers State legislatures to create special laws for Jammu and Kashmir 3. It vests Parliament with the power to make laws for enforcing Fundamental Rights","options":{"A":"2 only","B":"1 only","C":"3 only","D":"1, 2 and 3"},"correct":"C","answer_line":"Answer: (C) 3 only","explanation":"**Answer:** 3 only. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":115,"page":144,"question":"Which of the following Fundamental Rights are not available to foreigners in India? 1. Right against discrimination (Article 15) 2. Freedom of speech and expression (Article 19(1)(a)) ( 19(1)) 3. Right to protection in respect of conviction (Article 20) 4. Right to life and personal liberty (Article 21) ( 21)","options":{"A":"1 and 2 only","B":"2 and 3 only","C":"1 and 4 only","D":"1, 2 and 3 only"},"correct":"A","answer_line":"Answer: (A) 1 and 2 only","explanation":"**Answer:** 1 and 2 only. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":116,"page":145,"question":"Arrange the following Fundamental Rights in the order of their appearance in the Constitution: 1. Right to Freedom 2. Right to Equality 3. Right to Freedom of Religion 4. Right against Exploitation","options":{"A":"1-2-3-4","B":"2-1-4-3","C":"2-4-1-3","D":"4-2-1-3"},"correct":"B","answer_line":"Answer: (B) 2-1-4-3","explanation":"**Answer:** 2-1-4-3. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":117,"page":147,"question":"Which section of the Indian constitution ensure social and economic reforms in a country?","options":{"A":"Fundamental rights","B":"Fundamental duties","C":"Separation of powers","D":"Directive principal of state policy"},"correct":"D","answer_line":"Answer: (D) Directive principal of state policy","explanation":"**Answer:** Directive principal of state policy. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":118,"page":148,"question":"Which of the following statement is correct regarding the directive principles of state policy given in the Indian constitution? I. They are not enforceable by any court II. It shall be the duty of the state to apply these principles in making laws","options":{"A":"Only I","B":"Only II","C":"Both I and II","D":"Neither I nor II"},"correct":"C","answer_line":"Answer: (C) Both I and II","explanation":"**Answer:** Both I and II. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":119,"page":149,"question":"Which of the following is NOT the aim to establish the Directive Principles of State Policy?","options":{"A":"Welfare state","B":"Economic democracy","C":"Social democracy","D":"Political democracy"},"correct":"D","answer_line":"Answer: (D) Political democracy","explanation":"**Answer:** Political democracy. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":120,"page":150,"question":"In the case of State of Karnataka v. Ranganatha Reddy, the Supreme Court had to determine the constitutional validity of a legislation aiming at state monopoly in liquor trade. Which of the following correctly reflects the legal principle laid down by the Court in this case?","options":{"A":"The Court held that a law enacted to implement any Directive Principle under Part IV of the Constitution would automatically override any violation of Fundamental Rights under Part III.","B":"The Court ruled that Directive Principles cannot override Fundamental Rights, and any law inconsistent with Articles or is liable to be struck down regardless of its intention.","C":"The Court upheld the law under Article 31C as it was enacted to give effect to the Directive Principles, and held that Articles 39(b) and (c) take precedence over Articles 14 and 19 when properly invoked.","D":"The Court invalidated the state's policy, holding that the creation of a state monopoly in trade is inherently violative of Article 19(1)(g), regardless of Directive Principles or Article 31C."},"correct":"C","answer_line":"Answer: (C) The Court upheld the law under Article 31C as it was enacted to give effect to the Directive Principles, and held that Articles 39(b) and (c) take precedence over Articles 14 and 19 when properly invoked.","explanation":"**Answer:** The Court upheld the law under Article 31C as it was enacted to give effect to the Directive Principles, and held that Articles 39(b) and (c) take precedence over Articles 14 and 19 when properly invoked.. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":121,"page":152,"question":"Which of the following article of the Indian constitution promotes equal justice and free legal aid?","options":{"A":"Article 39 A","B":"Article 38","C":"Article 45","D":"Article 42"},"correct":"A","answer_line":"Answer: (A) Article 39 A","explanation":"**Answer:** Article 39 A. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":122,"page":153,"question":"Which of the following Directive Principles is inspired by Gandhian philosophy?","options":{"A":"Article 40-Organisation of village panchayats","B":"Article 48A-Protection of environment","C":"Article 44-Uniform civil code","D":"Article 39-Equal pay for equal work"},"correct":"A","answer_line":"Answer: (A) Article 40-Organisation of village panchayats","explanation":"**Answer:** Article 40-Organisation of village panchayats. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":123,"page":154,"question":"Article 40 of the Indian constitution is related with ___________ 40 _______","options":{"A":"Organization of village panchayats","B":"Free and compulsory education","C":"Free housing to the poor","D":"Free medical aid to the citizen"},"correct":"A","answer_line":"Answer: (A) Organization of village panchayats","explanation":"**Answer:** Organization of village panchayats. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":124,"page":155,"question":"What does the Uniform Civil Code (UCC) deal with?","options":{"A":"Traffic rules","B":"Taxes and banking","C":"Personal laws like marriage and inheritance","D":"Criminal punishments"},"correct":"C","answer_line":"Answer: (C) Personal laws like marriage and inheritance","explanation":"**Answer:** Personal laws like marriage and inheritance. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":125,"page":156,"question":"The Uniform Civil Code is mentioned in:","options":{"A":"Article 43","B":"Article 44","C":"Article 45","D":"Article 47"},"correct":"B","answer_line":"Answer: (B) Article 44","explanation":"**Answer:** Article 44. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":126,"page":157,"question":"What is the Uniform Civil Code (UCC)? (UCC)?","options":{"A":"A set of criminal laws","B":"A common set of personal laws for all citizens","C":"A law for environmental protection","D":"A code for taxation policies"},"correct":"B","answer_line":"Answer: (B) A common set of personal laws for all citizens","explanation":"**Answer:** A common set of personal laws for all citizens. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":127,"page":158,"question":"Which part of the Indian Constitution includes the Directive Principle regarding a Uniform Civil Code?","options":{"A":"Part III (Fundamental Rights)( )","B":"Part IV (Directive Principles of State Policy) ( IV )","C":"Part V (The Union) ( V )","D":"Part VI (The States) ( VI )"},"correct":"B","answer_line":"Answer: (B) Part IV (Directive Principles of State Policy) ( IV )","explanation":"**Answer:** Part IV (Directive Principles of State Policy) ( IV ). **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":128,"page":159,"question":"The concept of Uniform Civil Code is a part of which category of principles in the Indian Constitution?","options":{"A":"Fundamental Rights","B":"Fundamental Duties","C":"Directive Principles of State Policy","D":"Preamble objectives"},"correct":"C","answer_line":"Answer: (C) Directive Principles of State Policy","explanation":"**Answer:** Directive Principles of State Policy. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":129,"page":160,"question":"What makes the Goa Civil Code distinct from other personal laws in India?","options":{"A":"It applies only to the Hindu community in Goa.","B":"It is a uniform civil code that applies to all communities regardless of religion.","C":"It is based on British common law.","D":"It allows separate personal laws for different religions. ( - )"},"correct":"B","answer_line":"Answer: (B) It is a uniform civil code that applies to all communities regardless of religion.","explanation":"**Answer:** It is a uniform civil code that applies to all communities regardless of religion.. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":130,"page":161,"question":"Article 50 is part of which section of the Constitution? 50?","options":{"A":"Fundamental Duties","B":"Directive Principles of State Policy","C":"Fundamental Rights","D":"Preamble"},"correct":"B","answer_line":"Answer: (B) Directive Principles of State Policy","explanation":"**Answer:** Directive Principles of State Policy. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":131,"page":162,"question":"Article 51 of the Indian constitution is related with which of the following? 51?","options":{"A":"Promotion of co-operative societies","B":"Promotion of international peace and security","C":"Uniform Civil Code","D":"Organization of Agriculture and Animal Husbandry"},"correct":"B","answer_line":"Answer: (B) Promotion of international peace and security","explanation":"**Answer:** Promotion of international peace and security. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":132,"page":163,"question":"The Uniform Civil Code (UCC) aims to bring _____ laws under a single framework for all citizens. (UCC) _____","options":{"A":"Personal","B":"Corporate","C":"Educational","D":"Agricultural"},"correct":"A","answer_line":"Answer: (A) Personal","explanation":"**Answer:** Personal. **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":133,"page":164,"question":"The Uniform Civil Code (UCC) primarily aims to:","options":{"A":"Replace criminal laws","B":"Abolish parliamentary democracy","C":"Establish uniform laws on civil matters like marriage, divorce, inheritance (,, )","D":"Regulate foreign trade"},"correct":"C","answer_line":"Answer: (C) Establish uniform laws on civil matters like marriage, divorce, inheritance (,, )","explanation":"**Answer:** Establish uniform laws on civil matters like marriage, divorce, inheritance (,, ). **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":134,"page":165,"question":"Which of the following is true about Fundamental Rights and DPSPs? DPSP?","options":{"A":"Both are justiciable and enforceable by courts","B":"DPSPs override Fundamental Rights when in conflict ( DPSP )","C":"Fundamental Rights are justiciable, but DPSPs are not (, DPSP )","D":"DPSPs are guaranteed by the Constitution;Fundamental Rights are optional (DPSP ; )"},"correct":"C","answer_line":"Answer: (C) Fundamental Rights are justiciable, but DPSPs are not (, DPSP )","explanation":"**Answer:** Fundamental Rights are justiciable, but DPSPs are not (, DPSP ). **SSC Key Point:** Remember this fact together with the constitutional article/body/term named in the question; such direct fact-based associations are frequently tested in SSC Polity questions."},{"num":135,"page":166,"question":"Which of the following best reflects the constitutional dilemma in implementing the Uniform Civil Code (UCC) in India, as discussed in debates surrounding Article 44 and Article 25? (UCC), 44 25?","options":{"A":"UCC allows gender-based personal law systems to remain untouched under Article 14 (UCC 14 )","B":"UCC enforces cooperative federalism by giving states legislative powers on personal law (UCC )","C":"UCC operationalises the secular ethos by completely eliminating all religious laws (UCC )","D":"UCC aligns with Article 44 but may be seen to infringe upon religious freedom under Article 25 (UCC 44, 25 )"},"correct":"D","answer_line":"Answer: (D) UCC aligns with Article 44 but may be seen to infringe upon religious freedom under Article 25 (UCC 44, 25 )","explanation":"**Answer:** UCC aligns with Article 44 but may be seen to infringe upon religious freedom under Article 25 (UCC 44, 25 ). **SSC Key Point:** Remember this fa const state = Array(questions.length).fill(null);

function render() {
  const root=document.getElementById('questions');
  root.innerHTML='';
  questions.forEach((q,i)=>{
    const card=document.createElement('div'); card.className='card'; card.id='q'+i;
    const qn=document.createElement('div'); qn.className='qnum'; qn.textContent='Question '+(i+1);
    const qt=document.createElement('div'); qt.className='question'; qt.textContent=q.question;
    card.append(qn,qt);
    Object.entries(q.options).forEach(([letter,text])=>{
      const b=document.createElement('button'); b.className='option';
      b.textContent='('+letter+') '+text;
      b.onclick=()=>answer(i,letter,b);
      card.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='feedback'; fb.style.display='none'; fb.id='fb'+i;
    card.appendChild(fb);
    root.appendChild(card);
  });
}
function answer(i,letter,clicked){
  if(state[i]!==null) return;
  state[i]=letter;
  const q=questions[i];
  const card=document.getElementById('q'+i);
  card.querySelectorAll('.option').forEach(b=>{
    b.disabled=true;
    const l=(b.textContent.match(/^\(([A-D])\)/)||[])[1];
    if(l===q.correct) {
      b.classList.add('correct');
      if(letter===q.correct) b.classList.add('result-correct');
      else b.classList.add('correct-answer');
    }
    if(l===letter && letter!==q.correct) {
      b.classList.add('wrong','result-wrong');
    }
    if(l===letter) b.classList.add('selected');
  });
  const fb=document.getElementById('fb'+i);
  const ok=letter===q.correct;
  fb.className='feedback '+(ok?'good':'bad');
  fb.style.display='block';
  fb.innerHTML='<strong>'+ (ok?'Correct':'Incorrect') +'</strong><br>'+
    escapeHtml(q.answer_line)+
    (q.explanation ? '<div class="explanation"><strong>Explanation:</strong><br>'+escapeHtml(q.explanation).replace(/\n/g,'<br>')+'</div>' : '');
  updateStats();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

let activeCollection = null;

function toggleCollection(type){
  const panel=document.getElementById('collectionPanel');
  if(activeCollection===type){
    panel.classList.remove('show');
    activeCollection=null;
    return;
  }
  activeCollection=type;
  panel.classList.add('show');
  renderCollection(type);
}

function renderCollection(type){
  const title=document.getElementById('collectionTitle');
  const list=document.getElementById('collectionList');
  let indexes=[];
  if(type==='correct') indexes=state.map((x,i)=>x!==null && x===questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='wrong') indexes=state.map((x,i)=>x!==null && x!==questions[i].correct ? i : -1).filter(i=>i>=0);
  if(type==='unvisited') indexes=state.map((x,i)=>x===null ? i : -1).filter(i=>i>=0);

  const names={correct:'✓ Correct Questions',wrong:'✕ Incorrect Questions',unvisited:'○ Unvisited Questions'};
  title.textContent=names[type]+' ('+indexes.length+')';
  list.innerHTML='';
  if(!indexes.length){
    list.innerHTML='<span style="font-size:12px;color:#667085">No questions in this collection.</span>';
    return;
  }
  indexes.forEach(i=>{
    const b=document.createElement('button');
    b.className='collection-item';
    b.textContent='Q'+(i+1);
    b.onclick=()=>{
      const target=document.getElementById('q'+i);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    };
    list.appendChild(b);
  });
}

function updateStats(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('unvisited').textContent=unvisited;
  document.getElementById('attempted').textContent=attempted;
  document.getElementById('progress').style.width=(attempted/questions.length*100)+'%';
  document.getElementById('correctCount2').textContent=correct;
  document.getElementById('wrongCount2').textContent=wrong;
  document.getElementById('unvisitedCount2').textContent=unvisited;
  if(activeCollection) renderCollection(activeCollection);
  if(attempted===questions.length){
    const pct=(correct/questions.length*100).toFixed(2);
    const f=document.getElementById('final'); f.style.display='block';
    f.innerHTML='<strong>Final Score</strong><br>'+correct+' / '+questions.length+
      ' correct ('+pct+'%)<br><br><button class="reset" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Review Test</button>';
  }
}

function finishTest(){
  const attempted=state.filter(x=>x!==null).length;
  const correct=state.filter((x,i)=>x!==null && x===questions[i].correct).length;
  const wrong=attempted-correct;
  const unvisited=questions.length-attempted;
  const pct=(correct/questions.length*100).toFixed(2);

  const f=document.getElementById('final');
  f.style.display='block';
  f.innerHTML='<strong>Test Finished</strong>'+
    '<div class="finish-summary">'+
    '<strong>Correct:</strong> '+correct+'<br>'+
    '<strong>Incorrect:</strong> '+wrong+'<br>'+
    '<strong>Unvisited:</strong> '+unvisited+'<br>'+
    '<strong>Attempted:</strong> '+attempted+' / '+questions.length+'<br>'+
    '<strong>Score:</strong> '+correct+' / '+questions.length+' ('+pct+'%)'+
    '</div>';
  f.scrollIntoView({behavior:'smooth',block:'start'});
}

render();
</script>
